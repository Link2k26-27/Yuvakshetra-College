<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">
  <title>YIMS — Information Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="ambient ambient-c"></div>
  <div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>YIMS</h1>
    <p>Sign in to continue</p>

    <input
      id="loginEmail"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="login()">Sign In</button>

    <p id="loginError" class="login-error"></p>
  </div>
</div>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand-mark">✦</div>
        <div><div class="brand-name">YIMS</div><div class="brand-sub">Information Management</div></div>
      </div>
      <button class="header-icon" aria-label="Notifications">♧</button>
    </header>
    <section class="page-heading">
      <div><div class="eyebrow" id="pageEyebrow">WELCOME</div><h1 id="pageTitle">Welcome</h1><p id="pageSubtitle">Manage · Connect · Organize</p></div>
      <div class="date-pill" id="pageDate"></div>
    </section>
    <section id="appContent" class="page-content"></section>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-page="home"><span>⌂</span><small>Home</small></button>
    <button class="nav-item" data-page="contacts"><span>♧</span><small>Contacts</small></button>
    <button class="nav-item" data-page="files"><span>▣</span><small>Files</small></button>
    <button class="nav-item" data-page="hostel"><span>♜</span><small>Hostel</small></button>
    <button class="nav-item" data-page="counter"><span>♜</span><small>Counter</small></button>
  </nav>
  <div id="modalRoot"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
